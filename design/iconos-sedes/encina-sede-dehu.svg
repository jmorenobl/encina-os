<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!--
  Acceso a DEHU (notificaciones electronicas). El glifo es una campana:
  "aqui llegan avisos", legible a 48 px sin reconocer ninguna marca.
  Loseta y bellota: ver loseta.svg y LEEME.md de este directorio; geometria
  medida de la plantilla de Yaru, trazados propios, paleta de design/paleta.tsv.
  El glifo va en papel #F5F7F4 sobre la placa acento/acento-profundo.
  El comentario va dentro de <svg> por los 256 bytes de gdk-pixbuf.
-->
