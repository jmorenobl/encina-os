<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!--
  La loseta de los accesos a sedes: la plantilla SIN glifo. Los tres iconos de
  este directorio son esta loseta mas un dibujo blanco encima. Ver LEEME.md:
  la geometria esta MEDIDA de la plantilla oficial de Yaru (icons/src/
  fullcolor/Square App Icon Template.svg, commit e5d7e51) y los trazados estan
  escritos de cero: se copiaron numeros, no ficheros.

  Lo medido alli, en lienzo 256: placa de 208x208 con margen 24; la esquina no
  es un rx sino una cubica (39 px con controles a 35.3,0 y 39.1,3.6); brillo
  blanco 0.3 de ~2 px en el borde alto; sombra negra 0.2 abajo; dos sombras
  proyectadas desplazadas 1 px (desenfoque 4.48 al 0.2 y 1.12 al 0.1).

  Los colores NO son los de Yaru: placa de acento #3A664E a acento-profundo
  #2F4033 (design/paleta.tsv, VIGENTE), la misma pareja del icono del Centro
  de aplicaciones. Yaru degrada oscuro-arriba/claro-abajo; la placa de Encina
  ya vigente va clara-arriba/oscura-abajo y se conserva la de la casa.

  La bellota de la esquina (arcilla #D6BFA0) dice "acceso de Encina, no
  oficial": estos iconos abren sedes de la Administracion y NO deben parecer
  emblemas oficiales. Tension anotada en LEEME.md: el boton de la rejilla ya
  lleva la bellota, y es [OJOS] de Jorge si conviven.

  El comentario va DENTRO de <svg> porque gdk-pixbuf husmea los primeros 256
  bytes del fichero (medido el 2026-08-15: 256 carga, 257 no).
-->
<defs>
  <linearGradient id="placa" x1="0" y1="24" x2="0" y2="232" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3A664E"/>
    <stop offset="1" stop-color="#2F4033"/>
  </linearGradient>
  <filter id="sombra-ancha" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="4.48"/>
  </filter>
  <filter id="sombra-fina" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="1.12"/>
  </filter>
  <clipPath id="recorte-placa">
    <path d="M 63,24 H 193 C 228.3,24 232,27.6 232,63 V 193 C 232,228.4 228.3,232 193,232 H 63 C 27.7,232 24,228.4 24,193 V 63 C 24,27.6 27.7,24 63,24 Z"/>
  </clipPath>
</defs>

<path d="M 63,24 H 193 C 228.3,24 232,27.6 232,63 V 193 C 232,228.4 228.3,232 193,232 H 63 C 27.7,232 24,228.4 24,193 V 63 C 24,27.6 27.7,24 63,24 Z"
      transform="translate(0,1)" fill="#000000" opacity="0.2" filter="url(#sombra-ancha)"/>
<path d="M 63,24 H 193 C 228.3,24 232,27.6 232,63 V 193 C 232,228.4 228.3,232 193,232 H 63 C 27.7,232 24,228.4 24,193 V 63 C 24,27.6 27.7,24 63,24 Z"
      transform="translate(0,1)" fill="#000000" opacity="0.1" filter="url(#sombra-fina)"/>

<path d="M 63,24 H 193 C 228.3,24 232,27.6 232,63 V 193 C 232,228.4 228.3,232 193,232 H 63 C 27.7,232 24,228.4 24,193 V 63 C 24,27.6 27.7,24 63,24 Z"
      fill="url(#placa)"/>

<g clip-path="url(#recorte-placa)">
  <rect x="24" y="24" width="208" height="2.5" fill="#ffffff" opacity="0.3"/>
  <rect x="24" y="229.5" width="208" height="2.5" fill="#000000" opacity="0.2"/>
</g>

<g fill="#D6BFA0">
  <rect x="200.6" y="181" width="2.8" height="6" rx="1.4"/>
  <path d="M 190,193.5 c 0,-5.2 5.4,-8.5 12,-8.5 s 12,3.3 12,8.5 c 0,1.7 -1.3,3 -3,3 h -18 c -1.7,0 -3,-1.3 -3,-3 z"/>
  <path d="M 192.5,199.5 h 19 c -0.5,9 -4.5,14.5 -9.5,17.5 c -5,-3 -9,-8.5 -9.5,-17.5 z"/>
</g>
</svg>
