<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!--
  Acceso a Mi Carpeta Ciudadana. El glifo es una carpeta con una persona
  dentro: "tus papeles con la Administracion". La persona va en
  acento-profundo #2F4033, recortada sobre la carpeta blanca. Loseta y
  bellota: ver loseta.svg y LEEME.md; geometria medida de la plantilla de
  Yaru, trazados propios, paleta de design/paleta.tsv.
  El comentario va dentro de <svg> por los 256 bytes de gdk-pixbuf.
-->
<defs>
