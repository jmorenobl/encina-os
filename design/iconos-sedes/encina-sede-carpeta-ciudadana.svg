<path d="M 63,24 H 193 C 228.3,24 232,27.6 232,63 V 193 C 232,228.4 228.3,232 193,232 H 63 C 27.7,232 24,228.4 24,193 V 63 C 24,27.6 27.7,24 63,24 Z"
      fill="url(#placa)"/>
