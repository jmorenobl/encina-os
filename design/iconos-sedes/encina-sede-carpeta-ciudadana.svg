  </linearGradient>
  <filter id="sombra-ancha" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="4.48"/>
  </filter>
  <filter id="sombra-fina" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="1.12"/>
  </filter>
  <clipPath id="recorte-placa">
