# encina-espera-gpu.conf -- GDM no arranca hasta que udev ha terminado con
# los dispositivos. Lo pone encina-branding (conffile, desde 0.1.16).
#
# POR QUE EXISTE (MEDICIONES.md 4.70b y 4.70f, Acer Aspire ES1-524, AMD A9):
# Ubuntu no mete amdgpu en el initrd, en esa maquina el modulo tarda 17 s en
# cargar, y mutter 46.2 no sobrevive al cambio de tarjeta en caliente: el
# saludador nace sobre simpledrm, llega amdgpu, asevera 'hash_table != NULL'
# y se queda en negro para siempre. 0 de 5 arranques sin esto; 3 de 3 con esto.
# No es de Encina -ningun paquete toca ese traspaso- pero el medio tal cual lo
# reproduce en cualquier portatil AMD parecido, y «el primer arranque va y luego
# nunca» es la peor forma de fallar.
#
# POR QUE ESTA FORMA Y NO OTRA: de los tres remedios medidos es el unico que
# no nombra ningun modulo ni arquitectura. En una maquina donde udev acaba en
# segundos cuesta cero -medido en arm64, 4.71: udev-settle termina a 1,1 s y
# GDM arranca a los 2,0 s con y sin este fichero- y en el Acer cuesta justo
# los 17 s que hay que esperar. modules-load.d nombra amdgpu (en arm64 no
# existe) y meterlo en el initrd retrasa Plymouth de los 3 s a los 20.
#
# SU PRECIO, dicho por systemd en cada arranque y a proposito no callado:
#   systemd-udev-settle.service is deprecated. Please fix gdm.service not to pull it in.
# udev-settle espera a TODOS los dispositivos con 120 s de tope: una maquina
# con un dispositivo que nunca asiente retrasaria GDM ese tiempo. No se ha
# visto ninguna; tampoco se ha fabricado.
#
# Es un parche sobre un fallo ajeno (mutter). El dia que mutter aguante el
# cambio de tarjeta arriba, este fichero sobra y se quita con su fecha.
# Wants= hace falta: la unidad es 'static' y nadie mas la pide; sin Wants=,
# After= no ordenaria nada.
[Unit]
Wants=systemd-udev-settle.service
After=systemd-udev-settle.service
