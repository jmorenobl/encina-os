#cloud-config
#
# Encina OS - E3. El seed de la ISO que se entrega.
#
# DONDE VIVE ESTE FICHERO: en la RAIZ del ISO9660, con el nombre
# 'autoinstall.yaml'. El instalador lo encuentra como /cdrom/autoinstall.yaml,
# que es el QUINTO sitio que mira select_autoinstall (server.py:889-924), leido
# en el codigo que viaja dentro de la propia ISO (MEDICIONES.md §4.21c).
# E3 NO usa el volumen CIDATA. Y ojo: el CIDATA va CUARTO, o sea que si alguien
# conecta uno, GANA sobre este fichero. Es una propiedad util del producto -- la
# ISO se puede anular sin tocarla -- y una trampa para medir (trampa 16).
#
# LO QUE CAMBIA RESPECTO DEL SEED DE E2: ESTA ISO PREGUNTA, MENOS UNA COSA.
#
# Las secciones de 'interactive-sections' las contesta quien instala, en las
# pantallas de siempre de Ubuntu. Las que NO estan en esa lista las decide este
# fichero. Los nombres no son inventados: son los 'autoinstall_key' de los
# controladores de ESTA ISO (subiquity/server/controllers/*.py), y el mecanismo
# esta en controller.py:113-127.
#
# LA QUE NO SE PREGUNTA, Y ES A PROPOSITO: 'source'. Encina OS SE CONSTRUYE
# SOBRE LA INSTALACION MINIMA, y eso no es una preferencia de instalacion sino
# la forma del producto: la base es minima y lo que se anade encima se declara
# en encina-meta, que es el eje por el que crece (incremento E4). Si se
# preguntara, media entrega dependeria de que el usuario acertara con una
# pantalla, y dos maquinas de Encina OS no serian la misma cosa.
# Por el mismo motivo van fijos 'codecs' y 'drivers': software de terceros que
# la base minima no lleva.
#
# POR ESO AQUI NO HAY 'identity:', NI CONTRASENA, NI CLAVE SSH. No es que se
# hayan quitado por prudencia: es que sobran. La contrasena del seed de E2
# ('encina', debil y publica) existia porque una instalacion sin nadie delante
# tiene que traer el usuario escrito. Con alguien delante, el usuario lo crea el.
# Decision de Jorge, 2026-08-10, con su motivo en AGENTS.md §6ter.0.
#
# Y SE PUEDE QUITAR SIN ROMPER NADA, y esta comprobado leyendo, no supuesto:
# ni imagen/encina-seed.sh ni imagen/verificar-e2.sh nombran al usuario, ni usan
# /home ni $HOME. Todo el trabajo es del sistema -- /srv/encina-repo, apt, purgar
# snapd -- que es consecuencia directa de R1 (nada de /etc/skel).
#
# LO QUE ESTE FICHERO SIGUE SIN PODER HACER: quitar el clic de confirmacion. Y
# aqui ya no hace falta que lo haga: con secciones interactivas hay una persona
# delante, y esa pantalla es la de "instalar ahora" de toda la vida. Por eso E3
# NO necesita tocar el grub.cfg de la ISO ni, con el, su md5sum.txt.
#
# TODO EL TRABAJO DE ENCINA VA EN UNA SOLA late-command, en base64, y es LA MISMA
# de imagen/autoinstall.yaml, byte a byte: el fuente legible es
# imagen/encina-seed.sh. Si se cambia el guion hay que rehacer las dos.
autoinstall:
  version: 1

  # lo que contesta quien instala, como en Ubuntu
  interactive-sections:
    - locale       # idioma
    - keyboard     # teclado
    - network      # red
    - storage      # disco  (filesystem.py:248 -- la clave se llama 'storage')
    - identity     # usuario y contrasena
    - timezone     # zona horaria

  # lo que NO se pregunta, porque es lo que hace que esto sea Encina OS
  source:
    id: ubuntu-desktop-minimal
    search_drivers: false
  codecs:
    install: false
  drivers:
    install: false
  late-commands:
    # los dos testigos de §4.14e, que anclan esta instalacion con aquellas: uno
    # escrito sobre /target desde el entorno del instalador y otro por dentro
    # del chroot, que ademas deja dicho como quien corre
    - echo "testigo-entorno-instalador $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /target/etc/encina-e2-testigo-instalador
    - curtin in-target -- /bin/sh -c 'echo "testigo-in-target $(date -u +%Y-%m-%dT%H:%M:%SZ) uname=$(uname -m) id=$(id -u)" > /etc/encina-e2-testigo-in-target'
    - sh -c 'echo  | base64 -d > /tmp/encina-seed.sh; sh /tmp/encina-seed.sh; true'
