#cloud-config
#
# Encina OS - E2. El seed de verdad.
#
# Se sirve en un volumen FAT etiquetado CIDATA junto a 'meta-data' y al
# directorio 'encina-repo/', que lleva los cuatro .deb y su indice Packages.
# Lo fabrica imagen/fabricar-seed.sh; la ISO oficial NO se toca.
#
# LO QUE ESTE FICHERO NO PUEDE HACER, y esta leido en el codigo del instalador
# que viaja dentro de la ISO (MEDICIONES.md §4.16a): quitar el clic de
# confirmacion. La puerta es 'if "autoinstall" in self.app.kernel_cmdline'
# (install.py:587-597), y ninguna clave del YAML toca /proc/cmdline. La palabra
# la pone el hipervisor, SUELTA -- 'autoinstall=1' NO vale -- y esa decision
# esta tomada con su motivo en ENCINA-OS.md §10. E3 hereda la deuda de ponerla
# sin hipervisor.
#
# TODO EL TRABAJO DE ENCINA VA EN UNA SOLA late-command, en base64:
#   - en base64 para que no haya ni una comilla que YAML o el interprete puedan
#     interpretar de otra manera;
#   - en una sola porque asi lleva su propio registro dentro de /target, y cada
#     intento cuesta una instalacion entera de ~9 minutos;
#   - el fuente legible es imagen/encina-seed.sh, y fabricar-seed.sh se niega a
#     construir el volumen si los dos se han separado.
#
# CUIDADO CON LA IDENTIDAD DE ABAJO: la contrasena y la clave ssh son de
# laboratorio, desechables y publicas. Sirven para medir. Una entrega de verdad
# las cambia.
autoinstall:
  version: 1
  locale: es_ES.UTF-8
  keyboard:
    layout: es
  source:
    id: ubuntu-desktop-minimal
    search_drivers: false
  codecs:
    install: false
  drivers:
    install: false
  storage:
    layout:
      name: direct
      match:
        # no es adorno: el volumen del seed es otro disco, y sin esto
        # 'direct' podria elegirlo a el como destino (§4.14b)
        size: largest
  identity:
    realname: Encina E2
    username: encina
    hostname: encina-e2-completa
    password: "$6$X7olMGXFyS5DEjp$YAhAR8.YfZ9d4jsjTFdntvm3EBycrE4e5eAVEZR0uWs.ymcHgTUTsrPzrU7YAFF5Yyci.Pj/j5TMvnRwloB9k/"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGwuk6h/RqwaQdPCHM+8gNtqvZMuxt53qvxTNxsnGeH1 encina-e2-medicion-efimera
  late-commands:
    # los dos testigos de §4.14e, que anclan esta instalacion con aquellas: uno
    # escrito sobre /target desde el entorno del instalador y otro por dentro
    # del chroot, que ademas deja dicho como quien corre
    - echo "testigo-entorno-instalador $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /target/etc/encina-e2-testigo-instalador
    - curtin in-target -- /bin/sh -c 'echo "testigo-in-target $(date -u +%Y-%m-%dT%H:%M:%SZ) uname=$(uname -m) id=$(id -u)" > /etc/encina-e2-testigo-in-target'
    - sh -c 'echo  | base64 -d > /tmp/encina-seed.sh; sh /tmp/encina-seed.sh; true'
